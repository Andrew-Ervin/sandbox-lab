        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - coder
            - -d
            - coder
          periodSeconds: 5
          timeoutSeconds: 5
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - coder
            - -d
            - coder
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 36
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - kill -0 1
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres
      - name: tmp
        emptyDir: {}
      - name: run
        emptyDir: {}
  strategy:
    type: Recreate
