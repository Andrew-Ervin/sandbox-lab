---
apiVersion: v1
kind: Service
metadata:
  name: model-gateway
  namespace: lab-control
spec:
  selector:
    app: model-gateway
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-gateway
  namespace: lab-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-gateway
  template:
    metadata:
      labels:
        app: model-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: model-gateway
        image: sandbox-lab/gateway:local
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        command:
        - uvicorn
        - gateway:app
        - --app-dir
        - /app
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        - --no-access-log
        envFrom:
        - secretRef:
            name: model-credentials
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 3
          timeoutSeconds: 5
        env:
        - name: UPSTREAM_PROXY
          value: http://model-gateway-egress.lab-control.svc.cluster.local:3129
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: code
        configMap:
          name: gateway-code
  strategy:
    type: Recreate
