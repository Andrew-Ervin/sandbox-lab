apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-code
  namespace: lab-control
data:
  gateway.py: "\"\"\"Fixed-upstream model gateway. Capabilities expire, but are NOT\
    \ Pi-only.\"\"\"\nimport asyncio\nimport base64\nimport hashlib\nimport hmac\n\
    import json\nimport logging\nimport os\nimport re\nimport time\nfrom contextlib\
    \ import asynccontextmanager\n\nimport httpx\nfrom fastapi import FastAPI, HTTPException,\
    \ Request\nfrom fastapi.responses import StreamingResponse, JSONResponse\n\nMAX_BODY\
    \ = 2_000_000\nAUDIENCE = 'sandbox-lab-model'\nsecret = os.environ['LAB_TOKEN_SECRET'].encode()\n\
    if len(secret) < 32:\n    raise RuntimeError('LAB_TOKEN_SECRET must contain at\
    \ least 32 bytes')\nkey = os.environ['OPENROUTER_API_KEY']\nmodel = os.environ['OPENROUTER_MODEL']\n\
    allow_search = os.getenv('LAB_ALLOW_WEB_SEARCH', 'true').lower() == 'true'\n\n\
    \n@asynccontextmanager\nasync def lifespan(app):\n    async with httpx.AsyncClient(timeout=180,\
    \ proxy=os.getenv(\"UPSTREAM_PROXY\") or None, trust_env=False, follow_redirects=False,\n\
    \                                limits=httpx.Limits(max_connections=64, max_keepalive_connections=16))\
    \ as upstream:\n        app.state.upstream = upstream\n        yield\n\n\napp\
    \ = FastAPI(docs_url=None, redoc_url=None, openapi_url=None, lifespan=lifespan)\n\
    \n\n@app.exception_handler(HTTPException)\nasync def gateway_error(request, error):\n\
    \    # OpenAI-compatible shape lets Pi show the actual safe error instead of 'no\
    \ body'.\n    return JSONResponse(status_code=error.status_code, content={'error':\
    \ {\n        'message': str(error.detail), 'type': 'gateway_error', 'code': 'lab_'\
    \ + str(error.status_code)}},\n        headers={'Cache-Control': 'no-store'})\n\
    \n\ndef authorize(request):\n    try:\n        header = request.headers.get('authorization',\
    \ '')\n        if not header and request.headers.get('x-api-key'):\n         \
    \   header = 'Bearer ' + request.headers['x-api-key']\n        if not header.startswith('Bearer\
    \ ') or len(header) > 4096:\n            raise ValueError()\n        payload,\
    \ signature = header[7:].split('.')\n        expected = hmac.new(secret, payload.encode(),\
    \ hashlib.sha256).hexdigest()\n        if not hmac.compare_digest(expected, signature):\n\
    \            raise ValueError()\n        data = json.loads(base64.urlsafe_b64decode(payload\
    \ + '=' * (-len(payload) % 4)))\n        now = time.time()\n        if not isinstance(data,\
    \ dict) or data.get('aud') != AUDIENCE or data.get('model') != model:\n      \
    \      raise ValueError()\n        if any(type(data.get(k)) is not int for k in\
    \ ('iat', 'exp')):\n            raise ValueError()\n        if not (now - 3630\
    \ <= data['iat'] <= now + 30 and now < data['exp'] <= data['iat'] + 3600):\n \
    \           raise ValueError()\n        if not re.fullmatch(r'[a-f0-9]{32}', data.get('jti',\
    \ '')):\n            raise ValueError()\n        if not isinstance(data.get('workspace'),\
    \ str) or not 1 <= len(data['workspace']) <= 128:\n            raise ValueError()\n\
    \        return data\n    except (ValueError, KeyError, TypeError, UnicodeError):\n\
    \        raise HTTPException(403, 'Invalid model capability') from None\n\n\n\
    def compatible_messages(messages):\n    # Old Pi OpenAI sessions can replay provider-specific\
    \ reasoning that prevents\n    # ZDR routing. Omit it only from completed turns\
    \ on the outbound request.\n    # Keep visible/tool history and current-turn reasoning\
    \ for tool continuation;\n    # never rewrite saved sessions or strip other providers'\
    \ signed thinking.\n    if not model.startswith('openai/'):\n        return messages\n\
    \    last_user = max((i for i, message in enumerate(messages) if message['role']\
    \ == 'user'), default=-1)\n    replay_fields = {'reasoning_details', 'reasoning',\
    \ 'reasoning_content'}\n    return [\n        {k: v for k, v in message.items()\
    \ if k not in replay_fields}\n        if i < last_user and message['role'] ==\
    \ 'assistant' else message\n        for i, message in enumerate(messages)\n  \
    \  ]\n\n\ndef prepare_body(body):\n    if not isinstance(body, dict):\n      \
    \  raise HTTPException(400, 'Expected a JSON object')\n    messages = body.get('messages')\n\
    \    if not isinstance(messages, list) or not messages:\n        raise HTTPException(400,\
    \ 'Expected a non-empty messages array')\n    for message in messages:\n     \
    \   if not isinstance(message, dict) or message.get('role') not in {'system',\
    \ 'developer', 'user', 'assistant', 'tool'}:\n            raise HTTPException(400,\
    \ 'Invalid message')\n        content = message.get('content')\n        if content\
    \ is not None and not isinstance(content, (str, list)):\n            raise HTTPException(400,\
    \ 'Invalid message content')\n        if isinstance(content, list):\n        \
    \    for part in content:\n                if not isinstance(part, dict):\n  \
    \                  raise HTTPException(400, 'Invalid content part')\n        \
    \        if part.get('type') == 'text' and isinstance(part.get('text'), str):\n\
    \                    continue\n                # No provider-side fetching of\
    \ attacker-controlled URLs.\n                image = part.get('image_url')\n \
    \               if part.get('type') == 'image_url' and isinstance(image, dict)\
    \ and re.fullmatch(\n                    r'data:image/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+',\
    \ str(image.get('url', ''))):\n                    continue\n                raise\
    \ HTTPException(400, 'Only text and inline images are permitted')\n    tools =\
    \ body.get('tools', [])\n    if not isinstance(tools, list) or len(tools) > 32:\n\
    \        raise HTTPException(400, 'Invalid tools')\n    tools = [t for t in tools\
    \ if isinstance(t, dict) and t.get('type') == 'function' and isinstance(t.get('function'),\
    \ dict)]\n    allowed = {'messages', 'tool_choice', 'stream', 'temperature', 'top_p',\
    \ 'stop', 'parallel_tool_calls'}\n    result = {k: v for k, v in body.items()\
    \ if k in allowed}\n    result['messages'] = compatible_messages(messages)\n \
    \   if 'stream' in result and type(result['stream']) is not bool:\n        raise\
    \ HTTPException(400, 'Invalid streaming option')\n    result.update(model=model,\
    \ max_tokens=16000,\n                  reasoning={'effort': os.getenv('OPENROUTER_REASONING',\
    \ 'xhigh')},\n                  provider={'zdr': True, 'data_collection': 'deny'})\n\
    \    # Search is an approved disclosure channel, not a DLP control. Admin can\
    \ disable it.\n    if allow_search:\n        tools.append({'type': 'openrouter:web_search',\
    \ 'parameters': {\n            'engine': 'exa', 'max_results': 3, 'max_total_results':\
    \ 6, 'max_uses': 2, 'search_context_size': 'low'}})\n        result['max_tool_calls']\
    \ = 2\n    if tools:\n        result['tools'] = tools\n    else:\n        result.pop('tool_choice',\
    \ None)\n    return result\n\n\ndef prepare_native(body, protocol):\n    \"\"\"\
    Allow local harness tools, never upstream URL fetching or server-side tools.\"\
    \"\"\n    if not isinstance(body, dict):\n        raise HTTPException(400, 'Expected\
    \ a JSON object')\n    def check(value):\n        if isinstance(value, dict):\n\
    \            for key, child in value.items():\n                if key in {'image_url',\
    \ 'file_url', 'url'}:\n                    if not isinstance(child, str) or not\
    \ re.fullmatch(r'data:image/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+', child):\n\
    \                        raise HTTPException(400, 'Remote content is not permitted')\n\
    \                if key in {'file_id', 'server_url'}:\n                    raise\
    \ HTTPException(400, 'Remote content is not permitted')\n                check(child)\n\
    \        elif isinstance(value, list):\n            for child in value: check(child)\n\
    \    field = 'input' if protocol == 'responses' else 'messages'\n    content =\
    \ body.get(field)\n    if not isinstance(content, (str, list)) or not content:\n\
    \        raise HTTPException(400, 'Missing conversation input')\n    check(content)\n\
    \    tools = body.get('tools', [])\n    if not isinstance(tools, list) or len(tools)\
    \ > 128:\n        raise HTTPException(400, 'Invalid tools')\n    for tool in tools:\n\
    \        if not isinstance(tool, dict): raise HTTPException(400, 'Invalid tool')\n\
    \        if protocol == 'responses':\n            if tool.get('type') not in {'function',\
    \ 'custom'}:\n                raise HTTPException(400, 'Only local tools are permitted')\n\
    \        elif tool.get('type', 'custom') != 'custom' or not isinstance(tool.get('name'),\
    \ str):\n            raise HTTPException(400, 'Only local tools are permitted')\n\
    \    allowed = {field, 'instructions', 'system', 'tools', 'tool_choice', 'stream',\
    \ 'parallel_tool_calls'}\n    result = {k:v for k,v in body.items() if k in allowed}\n\
    \    result.update(model=model, provider={'zdr': True, 'data_collection': 'deny'})\n\
    \    if protocol == 'responses':\n        result.update(store=False, max_output_tokens=16000,\n\
    \                      reasoning={'effort': os.getenv('OPENROUTER_REASONING',\
    \ 'xhigh')})\n    else:\n        result.update(max_tokens=16000)\n    return result\n\
    \n\n@app.post('/v1/responses')\n@app.post('/v1/messages')\n@app.post('/v1/chat/completions')\n\
    async def completions(request: Request):\n    claims = authorize(request)\n  \
    \  try:\n        size = int(request.headers.get('content-length', '0'))\n    \
    \    if size < 0:\n            raise ValueError()\n    except ValueError:\n  \
    \      raise HTTPException(400, 'Invalid content length') from None\n    if size\
    \ > MAX_BODY:\n        raise HTTPException(413)\n    raw = bytearray()\n    try:\n\
    \        async with asyncio.timeout(30):\n            async for chunk in request.stream():\n\
    \                if len(raw) + len(chunk) > MAX_BODY:\n                    raise\
    \ HTTPException(413)\n                raw.extend(chunk)\n    except TimeoutError:\n\
    \        raise HTTPException(408) from None\n    try:\n        protocol = request.url.path.rsplit('/',\
    \ 1)[-1]\n        body = prepare_body(json.loads(raw)) if protocol == 'completions'\
    \ else prepare_native(json.loads(raw), protocol)\n    except (ValueError, UnicodeError,\
    \ RecursionError):\n        raise HTTPException(400, 'Invalid JSON') from None\n\
    \    client = request.app.state.upstream\n    try:\n        upstream = await client.send(client.build_request(\n\
    \            'POST', 'https://openrouter.ai/api/v1/' + ('chat/completions' if\
    \ protocol == 'completions' else protocol), json=body,\n            headers={'Authorization':\
    \ 'Bearer ' + key, 'X-Title': 'Sandbox Lab'}), stream=True)\n    except httpx.HTTPError\
    \ as error:\n        logging.getLogger('lab.model').warning('Model transport failure:\
    \ %s',type(error).__name__)\n        raise HTTPException(502, 'Model provider\
    \ unavailable') from None\n    if upstream.status_code >= 300:\n        # Only\
    \ fixed diagnostic categories/shape; never log prompt/provider error text.\n \
    \       error_bytes=bytearray()\n        async for part in upstream.aiter_bytes():\n\
    \            if len(error_bytes)+len(part)>65536: break\n            error_bytes.extend(part)\n\
    \        description=error_bytes.decode('utf-8',errors='replace').lower()\n  \
    \      categories=[label for label,needle in [('privacy','data policy'),('zdr','zdr'),('context','context\
    \ length'),('image','image'),('tools','tool'),('parameters','parameter'),('routing','endpoint'),('rate','rate\
    \ limit')] if needle in description]\n        logging.getLogger('lab.model').warning('Model\
    \ provider rejected request: status=%s categories=%s fields=%s messages=%s tools=%s',upstream.status_code,','.join(categories),','.join(sorted(body)),len(body.get('messages',\
    \ body.get('input', []))),len(body.get('tools',[])))\n        await upstream.aclose()\n\
    \        if 'privacy' in categories or 'zdr' in categories:\n            raise\
    \ HTTPException(403, 'OpenRouter could not route this request under the required\
    \ privacy policy. No privacy setting was relaxed. Ask the administrator to check\
    \ provider eligibility and saved-session compatibility.')\n        raise HTTPException(502,\
    \ 'Model provider rejected request')\n\n    async def chunks():\n        try:\n\
    \            async for chunk in upstream.aiter_bytes():\n                yield\
    \ chunk\n        finally:\n            await upstream.aclose()\n    return StreamingResponse(chunks(),\
    \ media_type=upstream.headers.get('content-type', 'application/json'),\n     \
    \                        headers={'Cache-Control': 'no-store'})\n\n\n@app.get('/healthz')\n\
    async def health():\n    return {'ok': True}\n\nSTT_MODEL = 'microsoft/mai-transcribe-2'\n\
    MAX_AUDIO_BYTES = 4_000_000\n\n\ndef prepare_transcription(body):\n    if not\
    \ isinstance(body, dict) or body.get('format') not in {'webm','ogg','mp4','wav'}:\n\
    \        raise HTTPException(400, 'Unsupported recording format')\n    encoded=body.get('data')\n\
    \    if not isinstance(encoded,str) or len(encoded)>((MAX_AUDIO_BYTES+2)//3)*4:\n\
    \        raise HTTPException(413, 'Recording is too large')\n    try: raw=base64.b64decode(encoded,validate=True)\n\
    \    except ValueError: raise HTTPException(400,'Invalid recording') from None\n\
    \    if not raw or len(raw)>MAX_AUDIO_BYTES: raise HTTPException(400,'Empty or\
    \ oversized recording')\n    return {'model':STT_MODEL,'input_audio':{'data':encoded,'format':body['format']},\n\
    \            'response_format':'json','provider':{'zdr':True,'data_collection':'deny'}}\n\
    \n\nasync def verify_transcription_privacy(client):\n    # STT ignores provider\
