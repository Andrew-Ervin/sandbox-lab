apiVersion: v1
kind: ConfigMap
metadata:
  name: package-policy
  namespace: lab-control
data:
  packages.json: "{\n  \"minimum_age_days\": 5,\n  \"overrides\": [],\n  \"package_access\"\
    : \"all-valid-registry-packages\"\n}\n"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: package-cache
  namespace: lab-control
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: package-proxy
  namespace: lab-control
spec:
  selector:
    app: package-proxy
  ports:
  - port: 3128
    targetPort: 3128
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: package-proxy
  namespace: lab-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: package-proxy
  template:
    metadata:
      labels:
        app: package-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: package-proxy
        image: sandbox-lab/packages:local
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        command:
        - uvicorn
        - package_gateway:app
        - --app-dir
        - /app
        - --host
        - 0.0.0.0
        - --port
        - '3128'
        - --no-access-log
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        - name: policy
          mountPath: /policy
          readOnly: true
        - name: cache
          mountPath: /cache
        ports:
        - containerPort: 3128
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3128
          periodSeconds: 3
          timeoutSeconds: 5
        env:
        - name: UPSTREAM_PROXY
          value: http://package-proxy-egress.lab-control.svc.cluster.local:3129
        startupProbe:
          httpGet:
            path: /healthz
            port: 3128
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3128
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: code
        configMap:
          name: package-code
      - name: policy
        configMap:
          name: package-policy
      - name: cache
        persistentVolumeClaim:
          claimName: package-cache
  strategy:
    type: Recreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-dns
  namespace: lab-control
data:
  Corefile: "cluster.local:1053 {\n  health :8080\n  ready :8181\n  forward . 10.96.0.10\n\
    \  cache 30\n}\n.:1053 {\n  template IN ANY {\n    rcode REFUSED\n  }\n}\n"
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-dns
  namespace: lab-control
spec:
  selector:
    app: sandbox-dns
  ports:
  - name: udp
    port: 53
    targetPort: 1053
    protocol: UDP
  - name: tcp
    port: 53
    targetPort: 1053
    protocol: TCP
  clusterIP: 10.96.0.53
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-dns
  namespace: lab-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-dns
  template:
    metadata:
      labels:
        app: sandbox-dns
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
      - name: sandbox-dns
        image: registry.k8s.io/coredns/coredns:v1.13.1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        command:
        - /coredns
        - -conf
        - /etc/coredns/Corefile
        volumeMounts:
        - name: config
          mountPath: /etc/coredns
          readOnly: true
        ports:
        - containerPort: 1053
        readinessProbe:
          httpGet:
            path: /ready
            port: 8181
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /ready
            port: 8181
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 36
      volumes:
      - name: config
        configMap:
          name: sandbox-dns
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-dns
  namespace: lab-control
spec:
  podSelector:
    matchLabels:
      app: sandbox-dns
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lab-dev
      podSelector:
        matchLabels: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lab-agents
      podSelector:
        matchLabels: {}
    ports:
    - protocol: UDP
      port: 1053
    - protocol: TCP
      port: 1053
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
